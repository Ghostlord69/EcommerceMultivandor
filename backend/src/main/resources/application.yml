spring:
  application:
    name: ecommerce-multivendor
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/multivendor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:multivendor}
    password: ${SPRING_DATASOURCE_PASSWORD:multivendor_secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-long!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
      key-secret: ${RAZORPAY_KEY_SECRET:change-me-razorpay}
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_placeholder}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.ecommerce.multivendor: INFO
