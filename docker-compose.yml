services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: multivendor
      MYSQL_USER: multivendor
      MYSQL_PASSWORD: multivendor_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/multivendor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: multivendor
      SPRING_DATASOURCE_PASSWORD: multivendor_secret
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: change-me-to-a-long-random-secret-at-least-256-bits-long!!
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: change-me-razorpay
      STRIPE_API_KEY: sk_test_placeholder
      APP_SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
